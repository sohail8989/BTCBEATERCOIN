<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhan Live - Voice Party</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ZegoCloud Express SDK -->
    <script src="https://unpkg.com/zego-express-engine-webrtc/index.js"></script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); }
        .dark-bg { background-color: #0b0f19; }
        .card-bg { background: #131b2e; border: 1px solid rgba(191, 149, 63, 0.2); }
    </style>
</head>
<body class="dark-bg text-white min-h-screen font-sans">

    <!-- TOP HEADER -->
    <header class="flex justify-between items-center p-4 card-bg border-b border-amber-500/20">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-microphone-lines text-amber-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider gold-gradient bg-clip-text text-transparent">FARHAN LIVE</h1>
        </div>
        <div id="user-info" class="hidden flex items-center space-x-3">
            <span id="nav-username" class="text-xs text-amber-200"></span>
            <button onclick="logout()" class="text-xs bg-red-600/80 px-3 py-1 rounded-full">Logout</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="p-4 max-w-md mx-auto">

        <!-- 1. LOGIN SCREEN -->
        <section id="login-section" class="flex flex-col items-center justify-center mt-20 p-6 card-bg rounded-2xl shadow-2xl">
            <div class="w-16 h-16 gold-gradient rounded-full flex items-center justify-center mb-4 shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-crown text-black text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Welcome to Farhan Live</h2>
            <p class="text-xs text-gray-400 mb-6 text-center">Login with your Google account to join voice parties & rooms</p>
            <button onclick="loginWithGoogle()" class="w-full py-3 px-4 bg-white text-black font-semibold rounded-xl flex items-center justify-center space-x-3 shadow-md hover:bg-gray-100 transition">
                <i class="fa-brands fa-google text-red-500 text-lg"></i>
                <span>Continue with Google</span>
            </button>
        </section>

        <!-- 2. LOBBY / HOME SCREEN -->
        <section id="lobby-section" class="hidden space-y-4 mt-4">
            <!-- User Profile Card -->
            <div class="card-bg p-4 rounded-xl flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img id="profile-pic" src="" class="w-12 h-12 rounded-full border border-amber-400 object-cover" alt="Avatar">
                    <div>
                        <h3 id="profile-name" class="font-bold text-sm"></h3>
                        <p class="text-xs text-amber-400">ID: <span id="profile-uid">---</span></p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-400">Coins: <span id="profile-coins" class="font-bold text-amber-300">0</span></p>
                    <p class="text-xs text-gray-400">Beans: <span id="profile-beans" class="font-bold text-amber-300">0</span></p>
                </div>
            </div>

            <!-- Admin Button (Only visible for hk03356677859@gmail.com) -->
            <div id="admin-btn-container" class="hidden">
                <button onclick="openAdminPanel()" class="w-full py-2 gold-gradient text-black font-bold rounded-xl shadow-lg flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Open Admin Dashboard</span>
                </button>
            </div>

            <!-- Create Room Action -->
            <div class="card-bg p-4 rounded-xl text-center space-y-3">
                <h3 class="font-bold text-sm">Start Your Own Voice Room</h3>
                <input type="text" id="room-title-input" placeholder="Enter Room Title (e.g. Chill & Music)" class="w-full bg-black/40 border border-amber-500/30 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-400">
                <button onclick="createRoom()" class="w-full py-2.5 gold-gradient text-black font-bold rounded-xl shadow-md text-sm">Go Live / Create Room</button>
            </div>

            <!-- Active Rooms List -->
            <div>
                <h3 class="text-sm font-bold mb-2 text-amber-400"><i class="fa-solid fa-fire"></i> Active Voice Rooms</h3>
                <div id="rooms-list" class="space-y-2">
                    <!-- Dynamic rooms will load here -->
                </div>
            </div>
        </section>

        <!-- 3. VOICE ROOM SCREEN (9 SEATS) -->
        <section id="room-section" class="hidden space-y-4 mt-2">
            <div class="card-bg p-3 rounded-xl flex justify-between items-center">
                <div>
                    <h3 id="active-room-title" class="font-bold text-sm text-amber-300">Room Title</h3>
                    <p class="text-[10px] text-gray-400">Room ID: <span id="active-room-id"></span></p>
                </div>
                <button onclick="leaveRoom()" class="px-3 py-1 bg-red-600 text-xs rounded-lg font-bold">Leave Room</button>
            </div>

            <!-- 9 Seats Grid -->
            <div class="grid grid-cols-3 gap-3 p-2 card-bg rounded-xl" id="seats-container">
                <!-- Seats generated via JS -->
            </div>

            <!-- Room Bottom Controls -->
            <div class="flex justify-around items-center pt-2">
                <button onclick="toggleMic()" id="mic-btn" class="w-12 h-12 rounded-full bg-gray-800 border border-amber-500 flex items-center justify-center text-amber-400">
                    <i class="fa-solid fa-microphone text-lg" id="mic-icon"></i>
                </button>
                <button onclick="sendGiftPopup()" class="px-4 py-2 gold-gradient text-black text-xs font-bold rounded-full shadow-md">
                    <i class="fa-solid fa-gift"></i> Send Gift
                </button>
            </div>
        </section>

        <!-- 4. ADMIN PANEL MODAL -->
        <section id="admin-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
            <div class="card-bg w-full max-w-sm p-5 rounded-2xl space-y-4">
                <div class="flex justify-between items-center border-b border-amber-500/20 pb-2">
                    <h3 class="font-bold text-amber-400"><i class="fa-solid fa-gear"></i> Owner Admin Panel</h3>
                    <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="space-y-3">
                    <p class="text-xs text-gray-300">Add Coins to User by UID:</p>
                    <input type="text" id="admin-target-uid" placeholder="Enter User UID" class="w-full bg-black/40 border border-amber-500/30 rounded-lg p-2 text-xs text-white">
                    <input type="number" id="admin-coin-amount" placeholder="Coin Amount (e.g. 5000)" class="w-full bg-black/40 border border-amber-500/30 rounded-lg p-2 text-xs text-white">
                    <button onclick="adminAddCoins()" class="w-full py-2 gold-gradient text-black font-bold rounded-xl text-xs">Add Coins</button>
                </div>
            </div>
        </section>

    </main>

    <!-- FIREBASE & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, get, update, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDoLiRbwPw8jpCt_KNsrRLpOOOZdnfNTYc",
            authDomain: "farhanlive-64a72.firebaseapp.com",
            databaseURL: "https://farhanlive-64a72-default-rtdb.firebaseio.com",
            projectId: "farhanlive-64a72",
            storageBucket: "farhanlive-64a72.firebasestorage.app",
            messagingSenderId: "482479811132",
            appId: "1:482479811132:web:7d349b4b927b4b40457139",
            measurementId: "G-6FN08JML9K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "hk03356677859@gmail.com";
        let currentUser = null;
        let currentRoomId = null;
        let zegoClient = null;
        let isMicOn = false;

        // Make functions global for HTML onclick bindings
        window.loginWithGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                checkOrCreateUserInDB(user);
            } catch (error) {
                alert("Login Error: " + error.message);
            }
        };

        window.logout = () => { signOut(auth); location.reload(); };

        function checkOrCreateUserInDB(user) {
            const userRef = ref(db, 'users/' + user.uid);
            get(userRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    const randomId = 'FARHAN-' + Math.floor(10000 + Math.random() * 90000);
                    set(userRef, {
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        photoURL: user.photoURL,
                        customId: randomId,
                        coins: 1000, // Starting free bonus coins
                        beans: 0
                    });
                }
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('lobby-section').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('nav-username').innerText = user.displayName;

                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('admin-btn-container').classList.remove('hidden');
                }

                loadUserProfile(user.uid);
                loadActiveRooms();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('lobby-section').classList.add('hidden');
                document.getElementById('user-info').classList.add('hidden');
            }
        });

        function loadUserProfile(uid) {
            onValue(ref(db, 'users/' + uid), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('profile-name').innerText = data.name;
                    document.getElementById('profile-uid').innerText = data.customId;
                    document.getElementById('profile-coins').innerText = data.coins;
                    document.getElementById('profile-beans').innerText = data.beans;
                }
            });
        }

        window.createRoom = () => {
            const title = document.getElementById('room-title-input').value.trim();
            if (!title) return alert("Please enter room title!");

            const roomsRef = ref(db, 'rooms');
            const newRoomRef = push(roomsRef);
            const roomId = newRoomRef.key;

            set(newRoomRef, {
                roomId: roomId,
                title: title,
                hostUid: currentUser.uid,
                hostName: currentUser.displayName
            }).then(() => {
                joinRoom(roomId, title);
            });
        }

        function loadActiveRooms() {
            const roomsRef = ref(db, 'rooms');
            onValue(roomsRef, (snapshot) => {
                const listEl = document.getElementById('rooms-list');
                listEl.innerHTML = '';
                const rooms = snapshot.val();
                if (rooms) {
                    Object.values(rooms).forEach(room => {
                        listEl.innerHTML += `
                            <div class="card-bg p-3 rounded-xl flex justify-between items-center">
                                <div>
                                    <h4 class="font-bold text-sm">${room.title}</h4>
                                    <p class="text-[10px] text-gray-400">Host: ${room.hostName}</p>
                                </div>
                                <button onclick="joinRoom('${room.roomId}', '${room.title}')" class="px-3 py-1.5 gold-gradient text-black font-bold rounded-lg text-xs">Join</button>
                            </div>
                        `;
                    });
                } else {
                    listEl.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">No active rooms found. Create one!</p>';
                }
            });
        }

        window.joinRoom = (roomId, title) => {
            currentRoomId = roomId;
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('room-section').classList.remove('hidden');
            document.getElementById('active-room-title').innerText = title;
            document.getElementById('active-room-id').innerText = roomId;
            buildSeatsGrid();
        }

        function buildSeatsGrid() {
            const container = document.getElementById('seats-container');
            container.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                container.innerHTML += `
                    <div class="h-20 card-bg rounded-xl flex flex-col items-center justify-center border border-amber-500/20 relative" id="seat-${i}">
                        <i class="fa-solid fa-user text-gray-500 text-xl mb-1"></i>
                        <span class="text-[10px] text-gray-400">Seat ${i}</span>
                    </div>
                `;
            }
        }

        window.leaveRoom = () => {
            if (zegoClient) { zegoClient.logoutRoom(currentRoomId); }
            document.getElementById('room-section').classList.add('hidden');
            document.getElementById('lobby-section').classList.remove('hidden');
            currentRoomId = null;
        }

        window.toggleMic = async () => {
            if (!isMicOn) {
                // Initialize ZegoCloud using keys from your project
                const appID = 2052526551; // From your screenshot
                const server = "wss://webliveroom" + appID + "-i.zego.im/ws";
                
                try {
                    zegoClient = ZegoExpressEngine.createEngine(appID, server);
                    const userID = currentUser.uid;
                    const userName = currentUser.displayName;
                    
                    // Token generation simulation for testing
                    const token = ""; 
                    await zegoClient.loginRoom(currentRoomId, token, { userID, userName }, { userUpdate: true });
                    const streamID = 'stream_' + currentUser.uid;
                    const localStream = await zegoClient.createStream({ microphone: true });
                    await zegoClient.startPublishingStream(streamID, localStream);
                    
                    isMicOn = true;
                    document.getElementById('mic-btn').classList.replace('bg-gray-800', 'bg-amber-500');
                    document.getElementById('mic-icon').classList.replace('text-amber-400', 'text-black');
                    alert("Mic is ON & Live!");
                } catch (error) {
                    alert("Mic Error: " + error.message);
                }
            } else {
                if (zegoClient) {
                    zegoClient.stopPublishingStream();
                    zegoClient.logoutRoom(currentRoomId);
                }
                isMicOn = false;
                document.getElementById('mic-btn').classList.replace('bg-amber-500', 'bg-gray-800');
                document.getElementById('mic-icon').classList.replace('text-black', 'text-amber-400');
                alert("Mic Muted.");
            }
        };

        window.openAdminPanel = () => { document.getElementById('admin-modal').classList.remove('hidden'); }
        window.closeAdminPanel = () => { document.getElementById('admin-modal').classList.add('hidden'); }

        window.adminAddCoins = () => {
            const targetUid = document.getElementById('admin-target-uid').value.trim();
            const amount = parseInt(document.getElementById('admin-coin-amount').value);
            if (!targetUid || !amount) return alert("Enter valid UID and amount!");

            // Search user by customId in database to add coins
            const usersRef = ref(db, 'users');
            get(usersRef).then((snapshot) => {
                let foundKey = null;
                snapshot.forEach((child) => {
                    if (child.val().customId === targetUid) {
                        foundKey = child.key;
                    }
                });

                if (foundKey) {
                    const currentCoins = snapshot.child(foundKey).val().coins || 0;
                    update(ref(db, 'users/' + foundKey), { coins: currentCoins + amount }).then(() => {
                        alert(`Successfully added ${amount} coins to ${targetUid}!`);
                        closeAdminPanel();
                    });
                } else {
                    alert("User UID not found!");
                }
            });
        };
    </script>
</body>
</html>
